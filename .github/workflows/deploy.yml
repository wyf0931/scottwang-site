name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # This job is the only pipeline for `main`, so the checks CI runs on pull
      # requests run here as well.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      # Vercel builds the project from source on its own builder. The alternative,
      # `vercel build` plus `vercel deploy --prebuilt`, uploaded the exported site
      # (~2400 files, and a new build id in every page defeats the upload cache), which
      # hit the Hobby upload limit of 5000 files per day after two deploys. A source
      # deploy uploads the sources only, ~170 files.
      - run: npx vercel deploy --prod --build-env NEXT_PUBLIC_SITE_URL=https://wyf0931.cn --token="${{ secrets.VERCEL_TOKEN }}"
