name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SITE_URL: https://wyf0931.cn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # This job is the only pipeline for `main`, so the checks CI runs on pull
      # requests run here as well. There is no separate `npm run build` step: the
      # `vercel build` step below runs the project build command, which is
      # `npm run build` including the `prebuild` generators.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      # Next writes a new build id into every page, so most files change hash on each
      # build and the Hobby upload limit (5000 files/day) is reached after two deploys.
      # --archive=tgz uploads the prebuilt output as one tarball instead of ~2400 files.
      - run: npx vercel deploy --prebuilt --archive=tgz --prod --token="${{ secrets.VERCEL_TOKEN }}"
