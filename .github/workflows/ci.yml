name: CI

# Pull requests only. A push to `main` runs the same lint, typecheck, test and build
# inside the deploy workflow, and `vercel build` runs the project build command there,
# so triggering CI on `main` as well would run the whole chain twice per push.
on:
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
